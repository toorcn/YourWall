<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
  </defs>

  <!-- Lighter Background -->
  <rect width="512" height="512" rx="100" fill="#f8fafc" />
  
  <!-- Minimalist 'W' Structure -->
  <g transform="translate(106, 130)">
    <!-- Left Column -->
    <rect x="0" y="0" width="90" height="250" rx="45" fill="#4f46e5" />
    
    <!-- Right Column -->
    <rect x="210" y="0" width="90" height="250" rx="45" fill="#4f46e5" />
    
    <!-- Center Drop (Pink Accent) -->
    <rect x="105" y="100" width="90" height="150" rx="45" fill="#f43f5e" />
    
    <!-- Dots / Particles above -->
    <circle cx="45" cy="-40" r="20" fill="#818cf8" />
    <circle cx="255" cy="-40" r="20" fill="#818cf8" />
    <circle cx="150" cy="50" r="25" fill="#fb7185" />
  </g>
</svg>
